services:
  php55:
    build: ./php55
    container_name: php55
    platform: linux/amd64
    volumes:
      - ./app:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/zz-local.ini:ro
    networks: [legacy_net]

  nginx:
    image: nginx:1.18
    container_name: legacy-nginx
    platform: linux/amd64
    depends_on: [php55]
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app:/var/www/html:ro
    networks: [legacy_net]

networks:
  legacy_net:
    driver: bridge

